# Деплой AtlasCMS на SpaceWeb через SSH + архив.
#
# Проект содержит тысячи файлов vendor/, которые не успевают загрузиться по
# одному файлу через FTP в лимит времени. Поэтому CI:
#   1) собирает единый архив atlas.zip (scripts/build-archive.php);
#   2) заливает его по SCP (SSH) — один файл;
#   3) распаковывает на сервере через unzip (SSH);
#   4) создаёт .env, если его ещё нет (из секрета ENV_CONTENT);
#   5) выполняет миграции и базовый сид: php artisan migrate --force / db:seed --force.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_HOST      — хост SSH (например, 77.222.40.198)
#   SSH_USERNAME  — логин SSH (например, netesngmai)
#   SSH_PASSWORD  — пароль SSH
#   SSH_PORT      — порт SSH (по умолчанию 22)
#   ENV_CONTENT   — (опционально) полное содержимое .env; пишется на сервер
#                   ТОЛЬКО если .env там ещё нет
#
# FTP-секреты не используются: загрузка идёт по SCP (SSH).
#
# На сервере НЕ перезаписываются: существующий .env, база данных,
# storage/app (изображения и файлы обмена 1С), storage/framework, storage/logs.

name: Deploy to SpaceWeb (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-spaceweb
  cancel-in-progress: true

env:
  # Адрес сайта для финальной проверки; замените при смене домена
  SITE_URL: http://netesngmai.temp.swtest.ru

jobs:
  deploy:
    name: Сборка, загрузка и развёртывание
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка PHP 8.3 (с zip для сборки архива)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, fileinfo, curl, zip, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Кэш зависимостей Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Установка зависимостей (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Сборка atlas.zip
        run: php scripts/build-archive.php

      - name: Подготовка .env для первого развёртывания
        run: |
          mkdir -p deploy
          if [ -n "$ENV_CONTENT" ]; then
            printf '%s' "$ENV_CONTENT" > deploy/.env
            echo ".env подготовлен из секрета ENV_CONTENT"
          else
            echo "ENV_CONTENT не задан — .env на сервере нужно создать вручную"
          fi
        env:
          ENV_CONTENT: ${{ secrets.ENV_CONTENT }}

      - name: Установка sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Загрузка атлас.zip по SCP
        run: |
          sshpass -p "$SSH_PASSWORD" scp -P "$SSH_PORT" -o StrictHostKeyChecking=no \
            deploy/atlas.zip "$SSH_USERNAME@$SSH_HOST:public_html/atlas.zip"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Распаковка и подготовка storage на сервере
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USERNAME@$SSH_HOST" '
              set -e
              cd ~/public_html || exit 1
              unzip -o atlas.zip
              rm -f atlas.zip
              # bootstrap/cache исключён из архива, но Laravel требует его наличия
              mkdir -p bootstrap/cache
              mkdir -p storage/app/public storage/app/1c \
                       storage/framework/cache/data storage/framework/sessions \
                       storage/framework/views storage/logs
              chmod -R 775 storage bootstrap/cache
            '
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Синхронизация .env из секрета ENV_CONTENT
        run: |
          if [ -f deploy/.env ]; then
            sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
              "$SSH_USERNAME@$SSH_HOST" "cat > ~/public_html/.env" < deploy/.env
            echo ".env обновлён на сервере из ENV_CONTENT"
          else
            echo "ENV_CONTENT не задан — .env на сервере не меняется"
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Миграции и базовый сид БД
        run: |
          # На хостинге CLI-php может быть старым (parse error в artisan).
          # Перебираем доступные бинарники PHP 8.x на сервере и используем первый.
          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USERNAME@$SSH_HOST" '
              set -e
              cd ~/public_html || exit 1

              PHP_BIN=""
              for bin in php8.3 php8.2 php8.1 php8.0 php; do
                if command -v "$bin" >/dev/null 2>&1; then
                  PHP_BIN="$bin"
                  break
                fi
              done

              if [ -z "$PHP_BIN" ]; then
                echo "Не найден PHP 8.x на сервере (проверьте бинарники: which php*)" >&2
                exit 1
              fi

              echo "PHP: $PHP_BIN $("$PHP_BIN" -r "echo PHP_VERSION;" )"
              "$PHP_BIN" artisan migrate --force
              "$PHP_BIN" artisan db:seed --force
            '
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Проверка, что сайт отвечает
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "${SITE_URL}/")
          echo "HTTP ${STATUS} для ${SITE_URL}/"
          if [ "$STATUS" = "000" ] || [ "$STATUS" = "500" ]; then
            echo "::warning::Сайт вернул ${STATUS} — проверьте .env на сервере и доступность БД MySQL"
          fi