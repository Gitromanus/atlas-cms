name: Deploy to SpaceWeb (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-spaceweb
  cancel-in-progress: true

env:
  SITE_URL: http://netesngmai.temp.swtest.ru

jobs:
  deploy:
    name: Сборка, загрузка и развёртывание
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка PHP 8.3 (с zip для сборки архива)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, fileinfo, curl, zip, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Кэш зависимостей Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Установка зависимостей (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Сборка atlas.zip
        run: |
          php scripts/build-archive.php
          ls -lh deploy/atlas.zip

      - name: Подготовка .env для первого развёртывания
        run: |
          mkdir -p deploy
          if [ -n "$ENV_CONTENT" ]; then
            printf '%s' "$ENV_CONTENT" > deploy/.env
            echo ".env подготовлен из секрета ENV_CONTENT"
          else
            echo "ENV_CONTENT не задан — .env на сервере нужно создать вручную"
          fi
        env:
          ENV_CONTENT: ${{ secrets.ENV_CONTENT }}

      - name: Установка sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Очистка места на сервере перед загрузкой
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USERNAME@$SSH_HOST" '
              set +e
              echo "=== Диск / квота ==="
              df -h ~ 2>/dev/null || df -h
              du -sh ~/public_html 2>/dev/null || true
              du -sh ~/public_html/storage 2>/dev/null || true
              du -sh ~/public_html/storage/app/1c 2>/dev/null || true

              rm -f ~/atlas.zip ~/public_html/atlas.zip ~/tmp_atlas.zip 2>/dev/null

              # Логи
              rm -f ~/public_html/storage/logs/*.log 2>/dev/null

              # Кэш обмена 1С (xml/zip/картинки сессий) — основной пожиратель квоты
              if [ -d ~/public_html/storage/app/1c ]; then
                rm -rf ~/public_html/storage/app/1c/*
                echo "storage/app/1c очищен"
              fi

              rm -rf ~/public_html/storage/framework/views/* 2>/dev/null
              rm -rf ~/public_html/storage/framework/cache/* 2>/dev/null
              rm -rf ~/public_html/bootstrap/cache/*.php 2>/dev/null

              echo "=== После очистки ==="
              df -h ~ 2>/dev/null || df -h
              du -sh ~/public_html 2>/dev/null || true
            '
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Загрузка atlas.zip в домашний каталог (не public_html)
        run: |
          sshpass -p "$SSH_PASSWORD" scp -P "$SSH_PORT" -o StrictHostKeyChecking=no -C \
            deploy/atlas.zip "$SSH_USERNAME@$SSH_HOST:~/atlas.zip"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Распаковка поверх public_html
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USERNAME@$SSH_HOST" '
              set -e
              cd ~ || exit 1
              test -f atlas.zip || { echo "atlas.zip не найден в HOME"; exit 1; }

              cd ~/public_html || exit 1
              unzip -o ~/atlas.zip
              rm -f ~/atlas.zip

              mkdir -p bootstrap/cache
              mkdir -p storage/app/public
              mkdir -p storage/framework/cache
              mkdir -p storage/framework/sessions
              mkdir -p storage/framework/views
              mkdir -p storage/logs
              chmod -R ug+rwx storage bootstrap/cache 2>/dev/null || true

              echo "Распаковка завершена"
            '
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Загрузка .env (если есть секрет)
        run: |
          if [ -f deploy/.env ]; then
            sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
              "$SSH_USERNAME@$SSH_HOST" "cat > ~/public_html/.env" < deploy/.env
            echo ".env загружен"
          else
            echo "deploy/.env нет — пропускаем"
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Миграции и очистка кэша
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USERNAME@$SSH_HOST" '
              set -e
              cd ~/public_html || exit 1

              PHP_BIN=""
              for bin in php8.3 php8.2 php8.1 php8.0 php; do
                if command -v "$bin" >/dev/null 2>&1; then
                  PHP_BIN="$bin"
                  break
                fi
              done

              if [ -z "$PHP_BIN" ]; then
                echo "Не найден PHP 8.x на сервере" >&2
                exit 1
              fi

              echo "PHP: $PHP_BIN $($PHP_BIN -r "echo PHP_VERSION;")"

              "$PHP_BIN" artisan storage:link 2>/dev/null || ln -sfn ../storage/app/public public/storage
              rm -rf storage/framework/views/* || true
              "$PHP_BIN" artisan view:clear 2>/dev/null || true
              "$PHP_BIN" artisan cache:clear 2>/dev/null || true
              "$PHP_BIN" artisan config:clear 2>/dev/null || true
              "$PHP_BIN" artisan route:clear 2>/dev/null || true
              "$PHP_BIN" artisan migrate --force

              echo "Deploy OK"
            '
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Проверка, что сайт отвечает
        run: |
          STATUS=$(curl -sS -k -o /dev/null -w "%{http_code}" --max-time 60 -L "${SITE_URL}/public/odeza-i-obuv/" || echo 000)
          echo "HTTP ${STATUS} для витрины"
          CAT=$(curl -sS -k -o /dev/null -w "%{http_code}" --max-time 60 -L "${SITE_URL}/public/odeza-i-obuv/catalog" || echo 000)
          echo "HTTP ${CAT} для каталога"
          if [ "$CAT" = "500" ] || [ "$STATUS" = "500" ]; then
            echo "::warning::Сайт вернул 500 — смотрите storage/logs/laravel.log на сервере"
          fi
