name: Deploy to SpaceWeb (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-spaceweb
  cancel-in-progress: true

env:
  SITE_URL: http://netesngmai.temp.swtest.ru

jobs:
  deploy:
    name: Сборка, загрузка и развёртывание
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка PHP 8.3 (с zip для сборки архива)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, fileinfo, curl, zip, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Кэш зависимостей Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Установка зависимостей (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Сборка atlas.zip
        run: php scripts/build-archive.php

      - name: Подготовка .env для первого развёртывания
        run: |
          mkdir -p deploy
          if [ -n "$ENV_CONTENT" ]; then
            printf '%s' "$ENV_CONTENT" > deploy/.env
            echo ".env подготовлен из секрета ENV_CONTENT"
          else
            echo "ENV_CONTENT не задан — .env на сервере нужно создать вручную"
          fi
        env:
          ENV_CONTENT: ${{ secrets.ENV_CONTENT }}

      - name: Установка sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Загрузка атлас.zip по SCP
        run: |
          sshpass -p "$SSH_PASSWORD" scp -P "$SSH_PORT" -o StrictHostKeyChecking=no \
            deploy/atlas.zip "$SSH_USERNAME@$SSH_HOST:public_html/atlas.zip"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Распаковка и подготовка storage на сервере
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USERNAME@$SSH_HOST" '
              set -e
              cd ~/public_html || exit 1
              unzip -o atlas.zip
              rm -f atlas.zip
              mkdir -p bootstrap/cache
              mkdir -p storage/app/public storage/app/1c \
                       storage/framework/cache/data storage/framework/sessions \
                       storage/framework/views storage/logs
              chmod -R 775 storage bootstrap/cache
            '
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Синхронизация .env из секрета ENV_CONTENT
        run: |
          if [ -f deploy/.env ]; then
            sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
              "$SSH_USERNAME@$SSH_HOST" "cat > ~/public_html/.env" < deploy/.env
            echo ".env обновлён на сервере из ENV_CONTENT"
          else
            echo "ENV_CONTENT не задан — .env на сервере не меняется"
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Диагностика подключения к MySQL (из .env на сервере)
        run: |
          PHP_CODE=$(cat <<'PHP'
          <?php
          $lines = file('.env'); $env = [];
          foreach ($lines as $l) {
              $l = trim($l);
              if (str_starts_with($l, 'DB_') && str_contains($l, '=')) {
                  [$k, $v] = explode('=', $l, 2);
                  $env[$k] = trim($v);
              }
          }
          echo 'PWD_LEN=' . strlen($env['DB_PASSWORD'] ?? '') . "\n";
          try {
              new PDO(
                  'mysql:host=' . ($env['DB_HOST'] ?? '') . ';port=' . ($env['DB_PORT'] ?? '3306') . ';dbname=' . ($env['DB_DATABASE'] ?? ''),
                  $env['DB_USERNAME'] ?? '',
                  $env['DB_PASSWORD'] ?? ''
              );
              echo "MYSQL_OK\n";
          } catch (Throwable $t) {
              echo 'MYSQL_ERR: ' . $t->getMessage() . "\n";
          }
          PHP
          )
          B64=$(printf '%s' "$PHP_CODE" | base64 -w0)
          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USERNAME@$SSH_HOST" "cd ~/public_html && echo $B64 | base64 -d > _dbcheck.php && php8.3 _dbcheck.php; rm -f _dbcheck.php"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Миграции и сид (включая FashionDemo)
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USERNAME@$SSH_HOST" '
              set -e
              cd ~/public_html || exit 1

              PHP_BIN=""
              for bin in php8.3 php8.2 php8.1 php8.0 php; do
                if command -v "$bin" >/dev/null 2>&1; then
                  PHP_BIN="$bin"
                  break
                fi
              done

              if [ -z "$PHP_BIN" ]; then
                echo "Не найден PHP 8.x на сервере" >&2
                exit 1
              fi

              echo "PHP: $PHP_BIN $($PHP_BIN -r "echo PHP_VERSION;")"
              grep -E "^DB_(CONNECTION|HOST|PORT|DATABASE|USERNAME)=" .env || true

              "$PHP_BIN" artisan migrate --force
              "$PHP_BIN" artisan db:seed --force
              "$PHP_BIN" artisan db:seed --class=Database\\Seeders\\FashionDemoSeeder --force
              echo "FashionDemoSeeder done"
            '
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      - name: Проверка, что сайт отвечает
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "${SITE_URL}/")
          echo "HTTP ${STATUS} для ${SITE_URL}/"
          if [ "$STATUS" = "000" ] || [ "$STATUS" = "500" ]; then
            echo "::warning::Сайт вернул ${STATUS} — проверьте .env на сервере и доступность БД MySQL"
          fi
